<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="EDUNOVA — Understand education. Make better choices.">
  <rect width="1200" height="630" fill="#f4f3ef"/>

  <!-- Faint coordinate grid -->
  <g stroke="#dcdad3" stroke-width="1">
    <path d="M0 105h1200M0 210h1200M0 315h1200M0 420h1200M0 525h1200"/>
    <path d="M120 0v630M240 0v630M360 0v630M480 0v630M600 0v630M720 0v630M840 0v630M960 0v630M1080 0v630"/>
  </g>

  <!-- Abstract education network -->
  <g stroke="#0e100e" stroke-width="1.5" fill="none" opacity="0.55">
    <path d="M900 150 1040 300"/>
    <path d="M900 150 780 300"/>
    <path d="M780 300 1040 300"/>
    <path d="M780 300 900 450"/>
    <path d="M1040 300 900 450"/>
    <path d="M900 450 1060 390"/>
  </g>
  <g fill="#0e100e">
    <circle cx="900" cy="150" r="6"/>
    <circle cx="780" cy="300" r="6"/>
    <circle cx="1040" cy="300" r="6"/>
    <circle cx="900" cy="450" r="6"/>
    <circle cx="1060" cy="390" r="6"/>
  </g>
  <circle cx="900" cy="150" r="17" fill="none" stroke="#1b4a37" stroke-width="2"/>
  <circle cx="1040" cy="300" r="17" fill="none" stroke="#1b4a37" stroke-width="2"/>

  <!-- Wordmark -->
  <g fill="#0e100e">
    <rect x="80" y="86" width="10" height="16"/>
    <rect x="97" y="78" width="10" height="24"/>
    <rect x="114" y="70" width="10" height="32"/>
    <rect x="131" y="62" width="10" height="40"/>
    <text x="164" y="100" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="500" letter-spacing="14">EDUNOVA</text>
  </g>

  <!-- Headline -->
  <text x="80" y="266" font-family="Instrument Serif, Georgia, serif" font-size="92" fill="#0e100e">Education is not</text>
  <text x="80" y="368" font-family="Instrument Serif, Georgia, serif" font-size="92" fill="#0e100e">one path.</text>

  <!-- Tagline -->
  <text x="80" y="450" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#6c716c">A modern information platform for navigating</text>
  <text x="80" y="486" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#6c716c">international education systems, pathways and opportunities.</text>

  <!-- Footer rule + label -->
  <path d="M80 556h1040" stroke="#dcdad3" stroke-width="1"/>
  <text x="80" y="596" font-family="IBM Plex Mono, monospace" font-size="18" letter-spacing="4" fill="#1b4a37">UNDERSTAND EDUCATION. MAKE BETTER CHOICES.</text>
</svg>
